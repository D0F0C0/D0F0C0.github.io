<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 50px;
        }

        table {
            width: 80%;
            max-width: 900px;
            border-collapse: collapse;
        }

        th {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: normal;

            border: 1px solid rgba(255, 255, 255, 0.3);

            background: rgba(255, 255, 255, 0.1);

            transition: 0.3s;
        }

        th:hover {
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <img
        class="background-image"
        src="https://upload-os-bbs.hoyolab.com/upload/2026/01/01/17138284/e1f03d3cdde6016876d9c086c6299984_5809435003641763311.jpeg"
        alt="Background">

    <div class="content">

        <h1>Welcome to My Website</h1>

        <p>This is my final project.</p>

        <table>
            <tr>
                <th>Bookmark</th>
                <th>Now</th>
                <th>Work</th>
                <th>About Me</th>
            </tr>
        </table>

    </div>

</body>

</html>
